name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # verify = unit + slice + local integration tests (surefire)
      #        + Testcontainers ITs against PostgreSQL, Redis, Kafka (failsafe; the runner has Docker)
      - name: Build and test
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

      - name: Check the compose file
        run: docker compose config --quiet

      - name: Build the Docker image
        run: docker build -t test-drive-booking:ci .
